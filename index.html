<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arc Squads</title>
<meta name="description" content="A 90-day arc you run with your mates. Coming to iPhone.">
<style>
  :root {
    --ink: #14181f;
    --muted: #5c6672;
    --accent: #1b7fa8;
    --page: #ffffff;
    --rule: #e3e7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6eaf0;
      --muted: #a0a9b5;
      --accent: #4fd1ff;
      --page: #0b0e15;
      --rule: #2a3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: var(--page);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 2rem 1.25rem;
  }
  main { max-width: 26rem; text-align: center; }
  .mark {
    font-size: 3rem;
    line-height: 1;
    margin-bottom: 1.25rem;
    font-weight: 700;
    letter-spacing: -.04em;
  }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--accent); }
  footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-size: .9rem;
    color: var(--muted);
  }
  footer a { margin: 0 .5rem; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">&#x2303;</div>
  <h1>Arc Squads</h1>
  <p>A 90-day arc you run with your mates.<br>Coming to iPhone.</p>
  <footer>
    <a href="/privacy/">Privacy policy</a>
    <a href="/terms/">Terms of use</a>
    <a href="mailto:hello@arcsquads.com">hello@arcsquads.com</a>
  </footer>
</main>
</body>
</html>
